name: Tests and evals
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: pytest -q
      - name: Browser script syntax
        run: |
          node --check web/app.js
          node --check web/visitprep.js
      - name: Synthetic UI state boundaries
        run: node tests/visitprep_ui_boundaries.cjs .
      - name: Captured-output replay and utility comparison
        run: python -m visitprep_eval.teaching --output "${{ runner.temp }}/visitprep-teaching"
      - name: VisitPrep offline adversarial evaluation
        run: python visitprep_eval/run_eval.py --app-root . --output "${{ runner.temp }}/visitprep-ci" --fail-on-fail
      - name: Real local NeMo comparison with outbound network blocked
        run: python scripts/visitprep_nemo_evaluation.py --output "${{ runner.temp }}/visitprep-nemo" --repeats 1 --fail-on-fail
      - run: python scripts/evaluate.py
      - run: python week6/run_redteam.py --app-root . --output work/week6-ci --label "CI application boundary retest" --fail-on-fail
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: |
            reports/evaluation.json
            work/week6-ci.*
            ${{ runner.temp }}/visitprep-ci/
            ${{ runner.temp }}/visitprep-teaching/
            ${{ runner.temp }}/visitprep-nemo/
