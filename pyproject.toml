[project]
name = "pausewell"
version = "0.1.0"
description = "Source-linked appointment preparation, patient-controlled agendas and bounded Apple Health check-ins"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "langgraph>=1,<2", "python-dotenv>=1,<2", "braintrust>=0.3,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
